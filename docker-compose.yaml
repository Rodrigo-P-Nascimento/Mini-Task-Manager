version: '3.8'

networks:
  mini-task-network:
    driver: bridge

services:
  # 1. Banco de dados do Auth Service
  auth-db:
    image: mysql:8.0
    container_name: auth_mysql_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root12345
      MYSQL_DATABASE: auth_db
      MYSQL_USER: rodrigo
      MYSQL_PASSWORD: 12345
    ports:
      - "3306:3306"
    volumes:
      - auth_db_data:/var/lib/mysql
    networks:
      - mini-task-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Banco de dados do Task Service
  task-db:
    image: mysql:8.0
    container_name: task_mysql_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root12345
      MYSQL_DATABASE: task_db
      MYSQL_USER: rodrigo
      MYSQL_PASSWORD: 12345
    ports:
      - "3307:3306"
    volumes:
      - task_db_data:/var/lib/mysql
    networks:
      - mini-task-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 3. Microsserviço de Autenticação
  auth-service:
    build:
      context: ./auth-service
    container_name: auth_service_app
    restart: always
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://auth-db:3306/auth_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: rodrigo
      SPRING_DATASOURCE_PASSWORD: 12345
    depends_on:
      auth-db:
        condition: service_healthy
    networks:
      - mini-task-network

  # 4. Microsserviço de Tarefas
  task-service:
    build:
      context: ./task-service
    container_name: task_service_app
    restart: always
    ports:
      - "8082:8082"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://task-db:3306/task_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: rodrigo
      SPRING_DATASOURCE_PASSWORD: 12345
    depends_on:
      task-db:
        condition: service_healthy
    networks:
      - mini-task-network

  # 5. Frontend Next.js
  frontend:
    build:
      context: ./frontend
    container_name: frontend_app
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      - auth-service
      - task-service
    networks:
      - mini-task-network

volumes:
  auth_db_data:
  task_db_data: